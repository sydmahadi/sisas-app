name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.0'
          channel: 'stable'

      - name: Setup App Structure & Renaming
        run: |
          mkdir -p temp_project
          cd temp_project
          flutter create . --org com.sisasbd.app --project-name sindabad_app
          cp -r * ..
          cd ..
          rm -rf temp_project
          mkdir -p lib
          if [ -f main.dart ]; then mv main.dart lib/main.dart; fi
          
          # App Name Setup
          sed -i 's/android:label=".*"/android:label="সিন্দাবাদ সাহিত্য সংসদ"/' android/app/src/main/AndroidManifest.xml

          # Add Internet Permissions to AndroidManifest.xml
          sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>' android/app/src/main/AndroidManifest.xml
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Add App Icon
        run: |
          if [ -f icon.png ]; then
            flutter pub add flutter_launcher_icons
            cat <<EOT >> pubspec.yaml

          flutter_launcher_icons:
            android: "launcher_icon"
            image_path: "icon.png"
            min_sdk_android: 21
          EOT
            flutter pub get
            dart run flutter_launcher_icons
          fi

      - name: Get Dependencies
        run: |
          flutter pub add webview_flutter

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sindabad-app-apk
          path: build/app/outputs/flutter-apk/app-release.apk
